# 1. KHAI BÁO VÙNG NHỚ (ZONE) RATE LIMIT
# Nằm ngoài khối server{}
# $binary_remote_addr: Nhận diện người dùng qua IP (dạng nhị phân để tiết kiệm RAM)
# zone=global_api_limit:10m: Cấp 10MB RAM để Nginx nhớ IP (chứa được khoảng 160.000 IP)
# rate=50r/s: Tốc độ xử lý tối đa là 50 requests / 1 giây / 1 IP
limit_req_zone $binary_remote_addr zone=global_api_limit:10m rate=50r/s;

upstream nestjs_api {
    server uni-api:3000;
}

server {
    listen 80;

    # ==========================================
    # LUỒNG 1: DÀNH CHO BACKEND (CÓ RATE LIMIT)
    # ==========================================
    location /api {
        # 2. KÍCH HOẠT RATE LIMIT
        # burst=100: Cho phép "nợ" tối đa 100 requests cùng lúc (phòng khi user bấm load trang có nhiều API call đồng thời)
        # nodelay: Các requests trong khoản burst sẽ được Nginx thả cho qua ngay lập tức chứ không bắt xếp hàng chờ

        limit_req zone=global_api_limit burst=100 nodelay;

        # Trả về mã HTTP 429 (Too Many Requests) chuẩn chỉ thay vì mã 503 mặc định của Nginx
        limit_req_status 429;

        # Cấu hình proxy sang NestJS
        proxy_pass http://nestjs_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 3. TRUYỀN IP THẬT CHO NESTJS (Bắt buộc phải có để làm Level 2)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # LUỒNG 2: DÀNH CHO FRONTEND (KHÔNG RATE LIMIT)
    # ==========================================
    location / {
        # KHÔNG đặt limit_req ở đây để trình duyệt tải HTML, CSS, JS, hình ảnh mượt mà nhất
        proxy_pass http://uni-web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}