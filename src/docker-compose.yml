version: '3.8'

services:
  # Cụm API Server (Có 3 bản sao để Load Balancing)
  uni-api:
    build:
      context: ./server
    image: unihub-server:latest
    env_file: .env.production
    deploy:
      replicas: 3
    restart: always

  # Web Client
  uni-web:
    build:
      context: ./web-client
    env_file: .env.production
    restart: always

  # Người gác cổng Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - uni-api
      - uni-web